name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, docs/images/**, scripts/site.sh, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Build and deploy are separate jobs, as in GitHub's own Pages template: in a
# single job, deploy-pages can look for the artifact before the upload is
# listed, and fails with "No artifacts named github-pages".
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/images
          cp -R site/. _site/
          cp docs/images/*.png docs/images/*.svg _site/images/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
